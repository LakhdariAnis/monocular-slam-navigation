<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring — Autonomous Car</title>
  <meta name="description" content="Real-time autonomous navigation monitoring dashboard with SLAM, IMU, and motor telemetry" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- PropTypes (required by Recharts) -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --text: #0f172a; --dim: #64748b; --line: #e5e7eb;
      --ind: #4f46e5; --grn: #10b981; --amb: #f59e0b; --red: #ef4444;
    }
    body { background: var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; margin: 0; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .card { background: var(--card); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.05); }
    .k { font-size: 12px; font-weight: 600; color: var(--dim); }
    .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; flex: none; }

    /* segmented control (station buttons) */
    .seg { display: inline-flex; background: #eef0f4; border-radius: 10px; padding: 3px; gap: 2px; }
    .seg button { font: 600 13px Manrope, sans-serif; padding: 5px 12px; border-radius: 8px; color: var(--dim); }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(16,24,40,.12); }

    /* toggle switch */
    .tg { width: 38px; height: 22px; border-radius: 11px; background: #e2e8f0; position: relative; flex: none; display: block; transition: background .2s; }
    .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
    .tg.on { background: var(--red); }
    .tg.on::after { left: 18px; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--ind); outline-offset: 2px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="App.js"></script>
</body>
</html>
